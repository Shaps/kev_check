name: Release

# Pushing a version tag is the release. Stable tags are vX.Y.Z and must be on main and on a
# commit GitHub reports as verified; release candidates are vX.Y.Z-rc.N and may be on any branch.
# The tag must equal the package.json version, because that version is sent to the API in the
# User-Agent header.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          package="$(jq -r .version package.json)"
          if [ "$version" != "$package" ]; then
            echo "::error::tag $TAG does not match package.json version $package. Bump package.json, rebuild dist/ and tag again."
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          if [ "$prerelease" = false ] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::stable tag $TAG points at a commit that is not on main."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Require a verified commit for a stable release
        if: steps.tag.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r verified reason < <(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            --jq '.commit.verification | "\(.verified) \(.reason)"')
          if [ "$verified" != true ]; then
            echo "::error::commit ${GITHUB_SHA:0:7} is not verified on GitHub ($reason), so the release would show no verified badge. Tag a commit that GitHub created (a squash or merge commit made in the web UI) or one signed with a key registered on GitHub."
            exit 1
          fi
          echo "Commit ${GITHUB_SHA:0:7} is verified ($reason)."

  # The same typecheck, tests, dist check and live API checks as every pull request.
  gate:
    needs: verify
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: [verify, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it alone."
            exit 0
          fi
          flags=(--verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
      - name: Move the major tag
        if: env.PRERELEASE == 'false'
        run: |
          set -euo pipefail
          major="v${VERSION%%.*}"
          # Never move the major tag backwards, for example when backporting a fix to an older line.
          latest="$(git tag --list "$major.*" | grep -E "^$major\.[0-9]+\.[0-9]+$" | sort -V | tail -n 1)"
          if [ "$latest" != "$TAG" ]; then
            echo "$TAG is not the newest $major release ($latest is); leaving $major where it is."
            exit 0
          fi
          git push --force origin "$GITHUB_SHA:refs/tags/$major"
          echo "$major now points at $TAG ($GITHUB_SHA)."
