name: Firetruck KEV check
description: Fail CI when a locked dependency is affected by a CISA Known Exploited Vulnerability.
author: Firetruck
branding:
  icon: alert-triangle
  color: red

inputs:
  paths:
    description: >
      Newline-separated lockfiles, SBOMs (CycloneDX or SPDX JSON), or glob patterns to scan.
      Leave empty to auto-detect supported lockfiles and SBOMs in the workspace.
    required: false
    default: ''
  api-key:
    description: Firetruck API key. Optional.
    required: false
    default: ''
  fail-on-kev:
    description: >
      Fail the step when a dependency is affected by a KEV (verdict "yes"). Unverified dependencies
      only warn and never fail the step.
    required: false
    default: 'true'
  fail-on-skipped:
    description: >
      Fail the step when any file is skipped (unsupported type, malformed content, a symlink or
      non-regular file outside the workspace, or an oversized file), or when a recognized lockfile
      parses to no dependencies and nothing else was checked. Set to "false" to only warn.
    required: false
    default: 'true'
  fail-on-unchecked:
    description: >
      Fail the step when any dependency was not checked (unsupported ecosystem, or an entry the API
      rejected). Unverified dependencies never fail the step.
    required: false
    default: 'false'
  concurrency:
    description: Maximum number of batch requests (up to 100 dependencies each) in flight at once.
    required: false
    default: '8'

outputs:
  findings:
    description: >
      JSON array with one entry per dependency whose verdict is "yes" (a KEV affects this version)
      or "unverified" (a linked KEV could not be compared), confirmed findings first. Each entry has
      ecosystem, name, version, verdict, files, kevs (confirmed KEV CVE IDs, empty when unverified),
      and unverifiedKevs (linked KEV CVE IDs that could not be compared).
  kev-count:
    description: Number of distinct KEV CVE IDs confirmed to affect a dependency (verdict "yes").
  vulnerable-count:
    description: Number of distinct dependencies (ecosystem, name and version) with verdict "yes".
  unverified-count:
    description: Number of distinct dependencies with verdict "unverified".
  unchecked-count:
    description: >
      Number of distinct dependencies that were not checked, either because their ecosystem is not
      supported or because the API rejected the entry.
  checked-count:
    description: Number of distinct dependencies (ecosystem, name and version) that received a verdict.

runs:
  using: node24
  main: dist/index.js
